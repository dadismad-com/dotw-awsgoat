name: 'Terraform Apply'


on:
  workflow_dispatch:
    inputs:
      module:
        type: choice
        description: "Select which module to deploy"
        options: 
        - module-1
        - module-2
        required: true
      enable_custom_domain:
        description: "Module-2 only: manage ACM + Route53 + ALB HTTPS"
        type: string
        required: false
        default: "true"
      hosted_zone_name:
        description: "Module-2 only: Route53 hosted zone name"
        type: string
        required: false
        default: "nocontrol.dev."
      app_domain_name:
        description: "Module-2 only: app custom domain"
        type: string
        required: false
        default: "awsgoat.nocontrol.dev"
      create_blue_dns_records:
        description: "Module-2 only: create defense/blue DNS A records"
        type: string
        required: false
        default: "true"
      blue_host_ip:
        description: "Module-2 only: blue-team host public IP"
        type: string
        required: false
        default: "44.194.67.73"

permissions: write-all

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production
    env: 
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"
      TERRAFORM_VAR_ARGS: ""

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.10.5

    - name: Set Account ID
      id: account
      run: |
        echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

    - name: Check previous AWSGoat Deployment
      id: check 
      run: |
        echo ${{ env.ACCOUNT_ID }}
        aws s3api head-object --bucket do-not-delete-awsgoat-state-files-${{ env.ACCOUNT_ID }} --key terraform.tfstate
      continue-on-error: true

    - name: Exit if previous deployment exists
      if: steps.check.outcome == 'success' 
      run: |
        echo "A Previous AWSGoat deployment exists, run the Terraform Destroy Action"
        exit 1

    # Initialize a new or existing Terraform working directory 
    - name: Terraform Init
      run: | 
        cd modules/${{ github.event.inputs.module }}
        terraform init 

    - name: Build module-2 Terraform var args
      if: github.event.inputs.module == 'module-2'
      run: |
        echo "TERRAFORM_VAR_ARGS=-var=enable_custom_domain=${{ github.event.inputs.enable_custom_domain }} -var=hosted_zone_name=${{ github.event.inputs.hosted_zone_name }} -var=app_domain_name=${{ github.event.inputs.app_domain_name }} -var=create_blue_dns_records=${{ github.event.inputs.create_blue_dns_records }} -var=blue_host_ip=${{ github.event.inputs.blue_host_ip }}" >> $GITHUB_ENV
        
    # Installs boto3
    - uses: actions/setup-python@v5
      with:
        python-version: 3
    - name: install
      run: |
        pip install boto3
    
    - name: Terraform Plan
      id: plan 
      run: | 
        cd modules/${{ github.event.inputs.module }}
        terraform plan -input=false ${TERRAFORM_VAR_ARGS}
      continue-on-error: false
      
    - name: Terraform Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1
    
    - name: Terraform Apply
      run: | 
        cd modules/${{ github.event.inputs.module }}
        terraform apply -auto-approve -input=false ${TERRAFORM_VAR_ARGS}
      continue-on-error: false

    # Copy tfstate file to s3 bucket
    - name: Copy terraform.tfstate file to s3bucket
      if: always()
      run: |
        cd modules/${{ github.event.inputs.module }}
        aws s3 cp ./terraform.tfstate s3://do-not-delete-awsgoat-state-files-${{ env.ACCOUNT_ID }}/terraform.tfstate 

    # Terraform Output the API Gateway url
    - name: Application URL
      run: |
        cd modules/${{ github.event.inputs.module }}
        terraform output
